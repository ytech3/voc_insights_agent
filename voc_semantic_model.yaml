    measures:
      - name: TOTAL_RESPONSES
        description: "Total count of survey responses"
        expr: COUNT(*)
        data_type: number
        default_aggregation: sum
        synonyms: ["total responses", "response count", "sample size", "n", "N"]
      
      - name: CONCESSION_PURCHASE_RATE
        description: "Percentage who purchased concessions"
        expr: ROUND(AVG(CASE WHEN CONCESS_SCREENER = 1 THEN 1 ELSE 0 END) * 100, 2)
        data_type: number
        default_aggregation: avg
        synonyms: ["concession purchase rate"]
      
      - name: PROMOTER_RATE
        description: "Percentage who are promoters NPS 9-10"
        expr: ROUND(AVG(CASE WHEN TB_ADDON_9 >= 9 THEN 1 ELSE 0 END) * 100, 2)
        data_type: number
        default_aggregation: avg
        synonyms: ["promoter rate"]
      
      - name: DETRACTOR_RATE
        description: "Percentage who are detractors NPS 0-6"
        expr: ROUND(AVG(CASE WHEN TB_ADDON_9 <= 6 THEN 1 ELSE 0 END) * 100, 2)
        data_type: number
        default_aggregation: avg
        synonyms: ["detractor rate"]
      
      - name: NET_PROMOTER_SCORE
        description: "Net Promoter Score"
        expr: ROUND((SUM(CASE WHEN TB_ADDON_9 >= 9 THEN 1 ELSE 0 END) - SUM(CASE WHEN TB_ADDON_9 <= 6 THEN 1 ELSE 0 END)) * 100.0 / NULLIF(COUNT(*), 0), 2)
        data_type: number
        default_aggregation: avg
        synonyms: ["net promoter score"]
      
      - name: FAMILY_ATTENDANCE_RATE
        description: "Percentage who attended with children"
        expr: ROUND(AVG(CASE WHEN ATTEND_WITH_CATEGORY_YOUNG_KIDS = 1 THEN 1 ELSE 0 END) * 100, 2)
        data_type: number
        default_aggregation: avg
        synonyms: ["family attendance rate"]
      
      - name: ADVERT_INFLUENCE
        description: "Numeric data for advert influence"
        expr: ADVERT_INFLUENCE
        data_type: number
        default_aggregation: avg
        synonyms: ["advert influence"]
      
