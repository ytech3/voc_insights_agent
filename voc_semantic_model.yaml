        expr: SUM(CONCESS_ORDER_METHOD_MOBILE)
        data_type: number
        default_aggregation: sum
        synonyms: ["number of mobile order users", "mobile order count", "how many used mobile ordering", "mobile ordering usage count"]   

      - name: MOBILE_ORDER_REPEAT_INTENT_PCT
        description: "Percentage of mobile order users who said they would use mobile ordering again in the future. Calculated as: (users who said Yes to future use / total mobile order users) * 100. Use for measuring mobile order satisfaction and likelihood of repeat usage. ONLY includes patrons who actually placed a mobile order (CONCESS_ORDER_METHOD_MOBILE = 1)."
        expr: ROUND((SUM(CASE WHEN CONCESS_ORDER_METHOD_MOBILE = 1 AND MOBILE_ORDER_EXP_FUTURE_DESC = 'Yes' THEN 1 ELSE 0 END) * 100.0) / NULLIF(SUM(CASE WHEN CONCESS_ORDER_METHOD_MOBILE = 1 THEN 1 ELSE 0 END), 0), 2)
        data_type: number
        default_aggregation: avg
        synonyms: ["mobile order repeat intent", "would use mobile ordering again percentage", "likelihood to use mobile ordering again", "mobile order retention rate", "mobile ordering repeat rate", "percentage would use mobile ordering again"] 
      
