      - name: USED_MOBILE_ORDERING
        description: "CRITICAL: Use this field to identify fans who ACTUALLY PLACED a mobile order (not just considered it). Values: 'Yes' if patron placed a mobile order (CONCESS_ORDER_METHOD_MOBILE = 1), 'No' otherwise. This is the ONLY correct way to filter for mobile order users when analyzing mobile ordering satisfaction, repeat intent, or usage. DO NOT use MOBILE_ORDER_CONSID_DESC to identify actual users - that field only captures if they thought about it, not if they did it."
        expr: CASE WHEN CONCESS_ORDER_METHOD_MOBILE = 1 THEN 'Yes' ELSE 'No' END
        data_type: varchar
        sample_values: ['Yes', 'No']
        synonyms: ['used mobile ordering', 'placed mobile order', 'actually used mobile ordering', 'mobile order user', 'fans who used mobile ordering', 'mobile ordering users']
        
      - name: MERCH_SCREENER_DESC
        description: "Survey question: \"Did you purchase any merchandise while at the stadium?\" Values: Yes, I did / No, I didn't / I don't remember / No, but I was interested in doing so / No, and I wasn't interested in doing so."
        expr: MERCH_SCREENER_DESC
        data_type: varchar
        sample_values: ["I don't remember", "No, I didn't", "Yes, I did"]

      - name: MOBILE_CONSID_REASON_DESC
        description: "Reasons why patron CONSIDERED but did NOT place a mobile order. Use when analyzing barriers to adoption among those who thought about it but chose not to use it."
        expr: MOBILE_CONSID_REASON_DESC
        data_type: varchar
        synonyms: ['mobile consid reason', 'why not use mobile ordering', 'reasons for not ordering', 'barriers to mobile ordering', 'why fans did not place mobile orders', 'why not mobile order', 'mobile ordering barriers', 'reasons to not use mobile']
        sample_values: [I didn't know mobile ordering was available", "No, I didn't consider it", "Yes, I considered it"]
        is_enum: true

      - name: MOBILE_CONSID_REASON_OTHERSPECIFY
        description: "Open-ended text feedback with additional details on why patron did NOT place a mobile order. Use alongside MOBILE_CONSID_REASON_DESC for detailed barrier analysis. Contains free-text responses."
        expr: MOBILE_CONSID_REASON_OTHERSPECIFY
        data_type: varchar
        synonyms: ['mobile consid reason other', 'mobile order barrier details', 'why not mobile order comments']
      
      - name: MOBILE_CONSID_REASON_OTHERSPECIFY_TOPICS
        description: "Classified topics from open-ended feedback on why patrons did NOT use mobile ordering. Contains topic codes extracted from free-text responses."
        expr: MOBILE_CONSID_REASON_OTHERSPECIFY_TOPICS
        data_type: varchar
        synonyms: ['mobile consid reason topics', 'mobile barrier topics']
      
      - name: MOBILE_ORDER_CONSID_DESC
        description:  "⚠️ WARNING: This field shows if patron CONSIDERED mobile ordering - NOT if they actually used it! Values: 'Yes, I considered it', 'No, I did not consider it', 'I did not know mobile ordering was available'. DO NOT USE this field to identify mobile order users. Instead use USED_MOBILE_ORDERING = 'Yes' or CONCESS_ORDER_METHOD_MOBILE = 1 to identify fans who ACTUALLY placed mobile orders."
        expr: MOBILE_ORDER_CONSID_DESC
        data_type: varchar
        synonyms: ['mobile order consideration', 'considered mobile ordering', 'mobile order consid text', 'mobile order consid']
        sample_values: ["Yes, I considered it", "No, I didn't consider it", "I didn't know mobile ordering was available"]
        is_enum: true
      
      - name: MOBILE_ORDER_EXP_FUTURE_DESC
        description: "Would patron use mobile ordering again? Values: 'Yes' (93% of users) or 'No' (7% of users). CRITICAL FILTER REQUIREMENT: This field is ONLY valid for fans who ACTUALLY placed mobile orders. You MUST filter by USED_MOBILE_ORDERING = 'Yes' or CONCESS_ORDER_METHOD_MOBILE = 1 when using this field, otherwise results will be incorrect. When calculating percentage who would use mobile ordering again, the denominator must be actual mobile order users (CONCESS_ORDER_METHOD_MOBILE = 1), NOT fans who considered it (mobile_order_consid_desc)."
        expr: MOBILE_ORDER_EXP_FUTURE_DESC
        data_type: varchar
        synonyms: ['mobile order future intent', 'would use mobile ordering again', 'mobile order exp future', 'future mobile order likelihood', 'use mobile ordering in future']
        sample_values: ['Yes', 'No']
        is_enum: true

