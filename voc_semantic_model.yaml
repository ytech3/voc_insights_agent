        data_type: varchar
        synonyms: ["non game ent feedback deprecated"]
      
      - name: NON_GAME_ENT_FEEDBACK_CLEAN
        description: "Non Game Ent Feedback - numeric codes filtered. Use for analysis."
        expr: CASE WHEN REGEXP_LIKE(NON_GAME_ENT_FEEDBACK, '^[0-9]+$') THEN NULL ELSE NON_GAME_ENT_FEEDBACK END
        data_type: varchar
        synonyms: ['non game ent feedback', 'non game ent feedback clean']
      
      - name: OVERALL_NUMRAT_OT
        description:  "PRIMARY QUALITATIVE FEEDBACK FIELD - Fan's detailed open-ended explanation of their 
          overall game day experience. This is the MOST IMPORTANT feedback field in the dataset.
          Use this field FIRST when users ask about qualitative feedback, fan comments, 
          what fans are saying, or detailed feedback. Contains rich text covering all aspects 
          of the fan experience including food, parking, staff, seating, entertainment, 
          facilities, pricing, and atmosphere. Apply AI_CLASSIFY with the category taxonomy 
          to segment feedback by topic. Apply AI_SENTIMENT for sentiment analysis."
        expr: OVERALL_NUMRAT_OT
        data_type: varchar
        synonyms: ["Qualitative feedback", "General qualiative feedback"]
      
      - name: OVERALL_NUMRAT_OT_PARENT_TOPICS
        description: "AI-pre-classified parent department for each fan's OVERALL_NUMRAT_OT feedback. Contains one of 9 departments: CONCESSIONS, RETAIL, GAME ENTERTAINMENT, FAN EXPERIENCE, PARKING, STADIUM OPERATIONS, DIGITAL EXPERIENCE, TICKETING, MARKETING. GROUP BY this column for department-level feedback volume — faster than running AI_CLASSIFY on raw text. Pairs with OVERALL_NUMRAT_OT_TOPICS for drill-down analysis."
        expr: OVERALL_NUMRAT_OT_PARENT_TOPICS
        data_type: varchar
        synonyms: ['feedback department', 'parent topic', 'feedback area', 'department feedback', 'feedback by department']
        sample_values: ['CONCESSIONS', 'RETAIL', 'GAME ENTERTAINMENT', 'FAN EXPERIENCE', 'PARKING', 'STADIUM OPERATIONS', 'DIGITAL EXPERIENCE', 'TICKETING', 'MARKETING']

      - name: OVERALL_NUMRAT_OT_TOPICS
        description: "AI-pre-classified detailed sub-topic category for each fan's OVERALL_NUMRAT_OT feedback. Contains one of 64 specific categories (e.g., 'Food Quality', 'Concession Wait Times', 'Parking Availability', 'Team Performance', 'Gate Entry Speed', 'Seating Comfort', 'Music', 'Mobile App'). GROUP BY this column to count feedback volume by topic — much faster than running AI_CLASSIFY on raw text. Pairs with OVERALL_NUMRAT_OT_PARENT_TOPICS for department rollups."
        expr: OVERALL_NUMRAT_OT_TOPICS
        data_type: varchar
        synonyms: ['feedback topic', 'feedback category', 'topic classification', 'detailed topic', 'feedback sub-category']
      
