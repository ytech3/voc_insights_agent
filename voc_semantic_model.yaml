  - name: overall_feedback_sentence_level
    description: "PRIMARY TABLE for analyzing fan feedback. Use this table by default for all feedback analysis questions. Each row represents one sentence from fan feedback, with individual sentiment and topic classification. Perfect for understanding mixed feedback (e.g., 'food was great but parking terrible'). Covers all seasons from 2023 forward."
    base_table:
      database: TBRDP_DW_DEV
      schema: IM_RPT
      table: V_OVERALL_FEEDBACK_SENTENCE_LEVEL
    
    dimensions:
      - name: qualtrics_id
        description: "Unique survey response identifier"
        expr: qualtrics_id
        data_type: varchar
        synonyms: ['response ID', 'survey ID']
      
      - name: season
        description: "Baseball season year"
        expr: season
        data_type: number
        synonyms: ['year', 'season year']
      
      - name: buyer_type
        description: "Type of ticket buyer"
        expr: buyer_type
        data_type: varchar
        synonyms: ['ticket type', 'customer type']

      - name: sentence_number
        description: "Sequential number of the sentence within the original feedback (1, 2, 3, etc.)"
        expr: sentence_number
        data_type: number
        synonyms: ['sentence order', 'sentence index', 'sentence position']
      
      - name: sentence_text
        description: "Individual sentence extracted from the original feedback"
        expr: sentence_text
        data_type: varchar
        synonyms: ['sentence', 'individual sentence', 'parsed sentence', 'text']
      
      - name: sentiment_category
        description: "Sentiment classification for this specific sentence (Positive, Neutral, or Negative)"
        expr: sentiment_category
        data_type: varchar
        synonyms: ['sentence sentiment', 'sentiment', 'tone', 'feeling']
      
      - name: ai_category
        description: "Topic category for this specific sentence (Food & Beverage Quality, Staff & Service, Parking & Transportation, Seating & Views, Entertainment & Atmosphere, Cleanliness & Facilities, Pricing & Value, Game Experience, Safety & Security, General Positive, Other)"
        expr: ai_category
        data_type: varchar
        synonyms: ['topic', 'category', 'feedback', 'subject', 'sentence topic', 'sentence category', 'topic', 'category', 'subject']
      
      - name: detailed_category
        description: "Combined topic and sentiment for this sentence (e.g., 'Food & Beverage Quality - Positive')"
        expr: detailed_category
        data_type: varchar
        synonyms: ['sentence detail', 'detailed topic']
      
      - name: original_feedback
        description: "Complete original feedback text before sentence splitting"
        expr: original_feedback
        data_type: varchar
        synonyms: ['full feedback', 'original text', 'complete feedback']
      
      - name: nps_segment
        description: "NPS classification of the respondent (Promoter, Passive, Detractor)"
        expr: nps_segment
        data_type: varchar
        synonyms: ['NPS', 'promoter status', 'customer segment']
    
    measures:
      - name: satisfaction_rating
        description: "Overall satisfaction rating (1-10 scale)"
        expr: satisfaction_rating
        data_type: number
        synonyms: ['rating', 'score', 'satisfaction']
      
      - name: sentence_length
        description: "Character length of the sentence"
        expr: sentence_length
        data_type: number
        synonyms: ['length', 'character count']
    
    metrics:
      - name: total_sentences
        description: "Total number of individual sentences analyzed"
        expr: COUNT(*)
        synonyms: 
          - 'sentence count'
          - 'number of sentences'
          - 'total sentence count'
      
      - name: unique_responses
        description: "Number of unique survey responses"
        expr: COUNT(DISTINCT qualtrics_id)
        synonyms:
          - 'response count'
          - 'number of responses'
          - 'unique feedback count'
      
      - name: positive_sentences
        description: "Number of sentences with positive sentiment"
        expr: COUNT(CASE WHEN sentiment_category = 'Positive' THEN 1 END)
        synonyms: 
          - 'positive count'
          - 'positive sentence count'
      
      - name: negative_sentences
        description: "Number of sentences with negative sentiment"
        expr: COUNT(CASE WHEN sentiment_category = 'Negative' THEN 1 END)
        synonyms: 
          - 'negative count'
          - 'negative sentence count'
          - 'complaints'
      
      - name: neutral_sentences
        description: "Number of sentences with neutral sentiment"
        expr: COUNT(CASE WHEN sentiment_category = 'Neutral' THEN 1 END)
        synonyms: 
          - 'neutral count'
          - 'neutral sentence count'
      
      - name: avg_sentences_per_response
        description: "Average number of sentences per feedback response"
        expr: COUNT(*) / NULLIF(COUNT(DISTINCT qualtrics_id), 0)
        synonyms: 
          - 'average sentences'
          - 'mean sentences per response'
      
      - name: positive_sentence_pct
        description: "Percentage of sentences that are positive"
        expr: ROUND(100.0 * COUNT(CASE WHEN sentiment_category = 'Positive' THEN 1 END) / NULLIF(COUNT(*), 0), 2)
        synonyms:
          - 'percent positive'
          - 'positive percentage'
      
      - name: negative_sentence_pct
        description: "Percentage of sentences that are negative"
        expr: ROUND(100.0 * COUNT(CASE WHEN sentiment_category = 'Negative' THEN 1 END) / NULLIF(COUNT(*), 0), 2)
        synonyms:
          - 'percent negative'
          - 'negative percentage'
    
    time_dimensions:
      - name: game_date
        description: "Date of the game"
        expr: game_date
        data_type: date
        synonyms: ['event date', 'match date', 'game day']

    filters:
      - name: positive_sentences_only
        description: "Filter to sentences with positive sentiment"
        expr: sentiment_category = 'Positive'
        synonyms: ['positive', 'positive feedback', 'praise']
      
      - name: negative_sentences_only
        description: "Filter to sentences with negative sentiment"
        expr: sentiment_category = 'Negative'
        synonyms: ['negative', 'negative feedback', 'complaints', 'issues']
      
      - name: neutral_sentences_only
        description: "Filter to sentences with neutral sentiment"
        expr: sentiment_category = 'Neutral'
        synonyms: ['neutral', 'neutral feedback']
      
      - name: food_beverage_sentences
        description: "Filter to food and beverage related sentences"
        expr: ai_category = 'Food & Beverage Quality'
        synonyms: ['food feedback', 'beverage feedback', 'concessions']
      
      - name: parking_sentences
        description: "Filter to parking related sentences"
        expr: ai_category = 'Parking & Transportation'
        synonyms: ['parking feedback', 'transportation feedback']
      
      - name: seating_sentences
        description: "Filter to seating and view related sentences"
        expr: ai_category = 'Seating & Views'
        synonyms: ['seating feedback', 'view feedback', 'seat complaints']
      
      - name: first_sentences_only
        description: "Filter to only the first sentence of each response"
        expr: sentence_number = 1
        synonyms: ['first sentence', 'opening sentence']

  - name: overall_feedback_response
    description: "AI-powered analysis of fan open-ended feedback with sentiment classification and topic categorization across all seasons (2023-present)"
    base_table:
      database: TBRDP_DW_DEV
      schema: IM_RPT
      table: V_OVERALL_FEEDBACK_ANALYSIS
    
    dimensions:
      - name: qualtrics_id
        description: "Unique survey response identifier"
        expr: qualtrics_id
        data_type: varchar
        synonyms: ['response ID', 'survey ID']
      
      - name: season
        description: "Baseball season year (2023, 2024, 2025, 2026, etc.)"
        expr: season
        data_type: number
        synonyms: ['year', 'season year']
      
      - name: game_date
        description: "Date of the game"
        expr: game_date
        data_type: date
        synonyms: ['event date', 'match date', 'game day']
      
      - name: buyer_type
        description: "Type of ticket buyer (Single Game, Season Ticket Holder, Group, etc.)"
        expr: buyer_type
        data_type: varchar
        synonyms: ['ticket type', 'customer type', 'buyer category']
      
      - name: ai_category
        description: "AI-classified topic category from fan feedback. Categories include: Food & Beverage Quality, Staff & Service, Parking & Transportation, Seating & Views, Entertainment & Atmosphere, Cleanliness & Facilities, Pricing & Value, Game Experience, Safety & Security, and General Positive"
        expr: ai_category
        data_type: varchar
        synonyms: 
          - 'feedback topic'
          - 'feedback category'
          - 'topic'
          - 'category'
          - 'subject'
          - 'feedback area'
          - 'complaint category'
      
      - name: sentiment_category
        description: "AI-classified sentiment from text feedback. Values are Positive, Neutral, or Negative based on the tone and content of fan comments"
        expr: sentiment_category
        data_type: varchar
        synonyms: 
          - 'sentiment'
          - 'feedback sentiment'
          - 'tone'
          - 'emotional tone'
          - 'fan sentiment'
      
      - name: detailed_category
        description: "Combined topic and sentiment for granular analysis (e.g., 'Food & Beverage Quality - Negative', 'Staff & Service - Positive')"
        expr: detailed_category
        data_type: varchar
        synonyms: 
          - 'detailed topic'
          - 'topic with sentiment'
          - 'category and sentiment'
      
      - name: nps_segment
        description: "NPS classification based on satisfaction rating: Promoter (9-10), Passive (7-8), Detractor (0-6)"
        expr: nps_segment
        data_type: varchar
        synonyms: 
          - 'NPS'
          - 'promoter status'
          - 'NPS group'
          - 'customer segment'
      
      - name: feedback_text
        description: "Original open-ended feedback text from fans explaining their game day experience"
        expr: feedback_text
        data_type: varchar
        synonyms: 
          - 'comment'
          - 'feedback'
          - 'text feedback'
          - 'fan comment'
          - 'open ended feedback'
      
      - name: existing_parent_topic
        description: "Pre-classified parent topic from Qualtrics"
        expr: existing_parent_topic
        data_type: varchar
      
      - name: existing_topic
        description: "Pre-classified detailed topic from Qualtrics"
        expr: existing_topic
        data_type: varchar
    
    measures:
      - name: satisfaction_rating
        description: "Numeric satisfaction rating provided by fan (1-10 scale)"
        expr: satisfaction_rating
        data_type: number
        synonyms: ['rating', 'score', 'satisfaction score']
      
      - name: feedback_length
        description: "Length of feedback text in characters"
        expr: feedback_length
        data_type: number
        synonyms: ['comment length', 'text length']
    
    metrics:
      - name: total_feedback_responses
        description: "Total number of feedback responses"
        expr: COUNT(*)
        synonyms: 
          - 'feedback count'
          - 'response count'
          - 'number of responses'
          - 'total responses'
      
      - name: avg_satisfaction
        description: "Average satisfaction rating across responses"
        expr: AVG(satisfaction_rating)
        synonyms: 
          - 'average rating'
          - 'mean satisfaction'
          - 'avg rating'
      
      - name: positive_feedback_count
        description: "Number of responses with positive sentiment"
        expr: COUNT(CASE WHEN sentiment_category = 'Positive' THEN 1 END)
        synonyms: 
          - 'positive responses'
          - 'positive sentiment count'
          - 'positive feedback'
      
      - name: negative_feedback_count
        description: "Number of responses with negative sentiment"
        expr: COUNT(CASE WHEN sentiment_category = 'Negative' THEN 1 END)
        synonyms: 
          - 'negative responses'
          - 'negative sentiment count'
          - 'negative feedback'
          - 'complaints'
      
      - name: neutral_feedback_count
        description: "Number of responses with neutral sentiment"
        expr: COUNT(CASE WHEN sentiment_category = 'Neutral' THEN 1 END)
        synonyms: 
          - 'neutral responses'
          - 'neutral sentiment count'
          - 'neutral feedback'
      
      - name: promoter_feedback_count
        description: "Number of feedback responses from promoters"
        expr: COUNT(CASE WHEN nps_segment = 'Promoter' THEN 1 END)
        synonyms: ['promoter count', 'promoter responses']
      
      - name: detractor_feedback_count
        description: "Number of feedback responses from detractors"
        expr: COUNT(CASE WHEN nps_segment = 'Detractor' THEN 1 END)
        synonyms: ['detractor count', 'detractor responses']
    
    time_dimensions:
      - name: game_date
        description: "Date of the game"
        expr: game_date
        data_type: date
        synonyms: ['event date', 'match date']
    
    filters:
      - name: positive_sentiment
        description: "Filter to positive feedback only"
        expr: sentiment_category = 'Positive'
        synonyms: ['positive feedback', 'good feedback', 'praise']
      
      - name: negative_sentiment
        description: "Filter to negative feedback only"
        expr: sentiment_category = 'Negative'
        synonyms: ['negative feedback', 'complaints', 'critical feedback', 'issues']
      
      - name: neutral_sentiment
        description: "Filter to neutral feedback only"
        expr: sentiment_category = 'Neutral'
        synonyms: ['neutral feedback', 'mixed feedback']
      
      - name: promoters_only
        description: "Filter to promoters (NPS 9-10)"
        expr: nps_segment = 'Promoter'
        synonyms: ['promoter feedback', 'highly satisfied', 'promoters']
      
      - name: detractors_only
        description: "Filter to detractors (NPS 0-6)"
        expr: nps_segment = 'Detractor'
        synonyms: ['detractor feedback', 'dissatisfied', 'detractors']
      
      - name: season_2023
        description: "Filter to 2023 season only"
        expr: season = 2023
        synonyms: ['2023', '2023 season']
      
      - name: season_2024
        description: "Filter to 2024 season only"
        expr: season = 2024
        synonyms: ['2024', '2024 season']
      
      - name: season_2025
        description: "Filter to 2025 season only"
        expr: season = 2025
        synonyms: ['2025', '2025 season', 'last season']
      
      - name: season_2026
        description: "Filter to 2026 season only"
        expr: season = 2026
        synonyms: ['2026', '2026 season', 'current season']

