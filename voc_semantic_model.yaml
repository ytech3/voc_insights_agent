name: tampa_bay_rays_voc_complete
description:  "Semantic model for Voice of Customer post-attendance survey data, enabling natural language queries about fan experience, satisfaction ratings, and attendance patterns."

custom_instructions: |
  SATISFACTION RATING SCALES - PAY ATTENTION TO EACH FIELD'S SCALE:
  Not all satisfaction ratings use the same scale. Always check the field description for the correct scale.
  
  2026 STAFF RATING ROUTING (CRITICAL):
  Starting in 2026, staff ratings use a NEW 0-10 scale (TB_ADDON_23_* fields).
  The OLD 1-5 scale fields (TB_ADDON_4_*) have ZERO valid data in 2026 — do NOT use them for 2026+ queries.
  
  For staff satisfaction queries in 2026:
  - TB_ADDON_23_1: Parking staff (0-10 scale, 10=best). Filter WHERE TB_ADDON_23_1 < 80.
  - TB_ADDON_23_3: Fan Host/Usher (0-10 scale, 10=best). Filter WHERE TB_ADDON_23_3 < 80.
  - TB_ADDON_23_5: Concessions staff (0-10 scale, 10=best). Filter WHERE TB_ADDON_23_5 < 80.
  - TB_ADDON_23_6: Retail staff (0-10 scale, 10=best). Filter WHERE TB_ADDON_23_6 < 80.
  - TB_ADDON_23_24: Wheelchair Team (0-10 scale, 10=best). Filter WHERE TB_ADDON_23_24 < 80.
  - TB_ADDON_23_38: Tech Team (0-10 scale, 10=best). Filter WHERE TB_ADDON_23_38 < 80.
  - TB_ADDON_23_60: Security (0-10 scale, 10=best). Filter WHERE TB_ADDON_23_60 < 80.
  - TB_ADDON_23_61: Ticket Scanner (0-10 scale, 10=best). Filter WHERE TB_ADDON_23_61 < 80.
  - TB_ADDON_23_67: Go-Ahead Entry (0-10 scale, 10=best). Filter WHERE TB_ADDON_23_67 < 80.
  
  For staff satisfaction queries in 2025 and earlier:
  - TB_ADDON_4_1: Parking staff (1-5 scale, 5=best)
  - TB_ADDON_4_3: Fan Host/Usher (1-5 scale, 5=best)
  - TB_ADDON_4_5: Concessions staff (1-5 scale, 5=best)
  - TB_ADDON_4_6: Retail staff (1-5 scale, 5=best)
  - TB_ADDON_4_24: Accessibility Support (1-5 scale, 5=best)
  - TB_ADDON_4_36: Fan Host Ticket Taker (1-5 scale, 5=best)
  - TB_ADDON_4_37: Security Staff (1-5 scale, 5=best)
  - TB_ADDON_4_38: Tech Team (1-5 scale, 5=best)
  - TB_ADDON_4_39: Premium Area Attendants (1-5 scale, 5=best)
  
  BAD DATA WARNINGS (2026):
  These columns contain ONLY the value 83 in 2026 (a survey code, not real data).
  The standard filter WHERE column < 80 correctly excludes them, resulting in 0 rows.
  Do NOT use these for 2026 analysis — warn the user there is no valid data:
  - STAFF_NUMRAT (constant 83 in 2026)
  - SEATVIEW_NUMRAT (constant 83 in 2026)
  - TB_ADDON_19 (constant 83 in 2026)
  - TB_ADDON_23_4 / Guest Services (constant 83 in 2026)
  
  0-10 SCALE fields (10=best):
  - OVERALL_NUMRAT (Overall satisfaction)
  - ENTERTAIN_NUMRAT (Entertainment satisfaction, 2024+)
  - CONCESS_NUMRAT (Concession satisfaction)
  - PARKING_NUMRAT (Parking satisfaction)
  - GE_NUMRAT (Gate Entry satisfaction, 2026+)
  - MERCH_NUMRAT (Merchandise satisfaction, 2025+ — stored 0-100, divide by 10)
  - TB_ADDON_23_* staff fields (2026+ — see routing above)
  
  QUERY ROUTING RULES - FOLLOW THESE STRICTLY:
  
  QUALITATIVE FEEDBACK QUERIES:
  When the user asks about "qualitative feedback", ALWAYS use and prioritize these fields:
  
  - OVERALL_NUMRAT_OT: Primary source for general fan feedback (MOST IMPORTANT)
  - INCENTIVES_OT: Open text about ticket purchasing decisions
  - TB_ADDON_8_1: Open text about tickets/seats issues
  - TB_ADDON_8_2: Open text about staff/service issues  
  - TB_ADDON_8_3: Open text about entertainment issues
  - TB_ADDON_8_4: Open text about concessions/food/beverage issues
  - TB_ADDON_8_5: Open text about cleanliness issues
  - TB_ADDON_8_6: Open text about parking issues
  - TB_ADDON_8_7: Open text about retail/merchandise issues
  - TB_ADDON_8_8: Open text about safety/security issues
  - TB_ADDON_8_9: Open text about app issues
  - TB_ADDON_8_10: Open text about other fan behavior issues
  - TB_ADDON_8_11: Open text about other issues not mentioned
  - TB_ADDON_5: Open text about Tropicana Field staff members 
  
  For qualitative queries, use AI_CLASSIFY or AI_SENTIMENT on these text fields.
  For topic-specific qualitative queries (e.g., "what are qualitative feedback about parking"), 
  prioritize the relevant TB_ADDON_8_* field AND filter OVERALL_NUMRAT_OT for that topic.

  CATEGORY TAXONOMY for classifying OVERALL_NUMRAT_OT (64 categories, 9 departments):
  
  CONCESSIONS (15 categories):
  - "Food Quality" - taste, freshness, food temperature, portion size, presentation
  - "Beverage Quality" - drink quality, freshness, temperature, taste
  - "Concession Wait Times" - line length, wait duration, speed of service
  - "Concession Staff Service" - staff friendliness, helpfulness at concession stands
  - "Concessions Staff" - general concessions staff interactions, attitude, professionalism
  - "Food Cost" - food pricing, value for money on food items
  - "Beverage Cost" - drink pricing, value for money on beverages
  - "Menu Variety" - selection, options available, dietary accommodations
  - "Hot Dogs" - hot dog quality, taste, preparation
  - "Pizza" - pizza quality, taste, preparation
  - "Burger" - burger quality, taste, preparation
  - "Fries" - fries quality, taste, preparation
  - "Vegan Options" - plant-based food, vegan/vegetarian availability
  - "Alcohol" - beer, wine, spirits quality and selection
  - "Alcohol Pricing" - beer prices, drink prices, alcohol value

  RETAIL (5 categories):
  - "Merchandise Selection" - product variety, availability, sizing
  - "Merchandise Cost" - merchandise pricing, value
  - "Team Store Experience" - store layout, browsing, shopping experience
  - "Team Store Line" - retail checkout wait, store crowding
  - "Retail Staff" - retail and team store staff interactions, helpfulness, merch staff

  GAME ENTERTAINMENT (10 categories):
  - "Team Performance" - on-field play, wins/losses, player performance
  - "Game Competitiveness" - close games, exciting matchups, competitive play
  - "On-Field Entertainment" - between-inning activities, on-field contests
  - "Game Production" - scoreboard, video board, sound system, production quality
  - "Promotions" - special deals, promotional offers, marketing events
  - "Music" - music selection, DJ, walk-up songs, volume
  - "Giveaway" - promotional items, bobbleheads, giveaway quality
  - "Kids Club" - children's activities, kids zone, family programming
  - "Pregame" - pregame ceremonies, warmups, early entry experience
  - "Postgame" - postgame activities, fireworks, post-event experience

  FAN EXPERIENCE (11 categories):
  - "Fan Experience" - general overall experience comments, catch-all for broad positive/negative experience feedback
  - "Crowd Energy" - fan excitement, atmosphere, crowd engagement
  - "Seating Comfort" - seat quality, legroom, comfort, seat condition
  - "Venue Cleanliness" - general cleanliness, trash, upkeep
  - "Wayfinding" - signage, navigation, finding seats/concessions
  - "Staff Support" - usher helpfulness, guest services, general staff attitude, non-concession/non-retail staff
  - "ADA Accessibility" - handicapped parking, wheelchair access, ADA services
  - "Restroom Experience" - restroom cleanliness, wait times, supplies
  - "Seat View" - sightlines, obstructions, view quality
  - "Run the Bases" - postgame run the bases experience for kids/families
  - "Autographs" - player autograph opportunities, meet and greet

  PARKING (3 categories):
  - "Parking Availability" - finding spots, lot capacity, parking options
  - "Departure Traffic" - leaving the stadium, traffic, exit flow
  - "Parking Cost" - parking pricing, value, lot fees

  STADIUM OPERATIONS (4 categories):
  - "Facility Maintenance" - building condition, repairs, facility upkeep
  - "Gate Entry Speed" - entry lines, security screening, ticket scanning, Go-Ahead Entry
  - "Weather Impact" - temperature, air conditioning, rain, weather effects
  - "Bathroom Cleanliness" - restroom maintenance, hygiene, supplies

  DIGITAL EXPERIENCE (4 categories):
  - "Mobile App" - Rays app functionality, usability, features
  - "In-Venue Wi-Fi" - connectivity, speed, availability
  - "Mobile Ordering" - in-app food ordering, pickup experience
  - "Seat Upgrade" - digital seat upgrade process, availability

  TICKETING (8 categories):
  - "Ticket Purchase Process" - buying tickets, checkout, transaction experience
  - "Mobile Ticketing" - digital tickets, mobile entry, ticket transfer
  - "Ticketing Value Perception" - ticket value for money, pricing satisfaction
  - "Ticket Pricing" - ticket cost, price levels, affordability
  - "Seating Locations" - section options, seat selection, location quality
  - "Premium Experience" - premium seating, VIP areas, club level
  - "Baldwin Group Club" - Baldwin Group Club specific experience
  - "Suites" - suite experience, private seating areas

  MARKETING (4 categories):
  - "Raymond the Mascot" - mascot interactions, entertainment, appearances
  - "Theme Night" - themed game experiences, special event nights
  - "Concert Experience" - concert events, musical performances at venue
  - "Concert Artist" - specific artist/performer feedback

  NOTE: The V_OVERALL_FEEDBACK_ANALYSIS view uses AI_CLASSIFY with these 64 categories
  and maps them to the 9 parent departments above. When users ask about feedback by
  department or category, use V_OVERALL_FEEDBACK_ANALYSIS which has pre-classified
  AI_CATEGORY and PARENT_CATEGORY columns.

  PERCENTAGE CALCULATION RULES FOR CATEGORICAL/ENUM FIELDS:
  - When calculating percentages for categorical fields (agreement scales, satisfaction levels, yes/no questions):
    
  - CORRECT PATTERN - Use CASE WHEN inside aggregation:
     ROUND(100.0 * SUM(CASE WHEN field IN ('Value1', 'Value2') THEN 1 ELSE 0 END) 
        / NULLIF(COUNT(CASE WHEN field IS NOT NULL THEN 1 END), 0), 2)
    
  - WRONG PATTERN - Never filter in WHERE clause then calculate percentage:
      WHERE field = 'Value1' ... COUNT(*) / COUNT(field)
      This produces 100% because the denominator only includes filtered rows.
    
  - The denominator must ALWAYS be the total population being analyzed, not the filtered subset.
    
  - For questions like "what percentage strongly agree":
      SUM(CASE WHEN field = 'Strongly agree' THEN 1 ELSE 0 END) / NULLIF(COUNT(field), 0) * 100
    
  - For questions like "what percentage agree" (combining categories):
      SUM(CASE WHEN field IN ('Strongly agree', 'Somewhat agree') THEN 1 ELSE 0 END) / NULLIF(COUNT(field), 0) * 100

  - CATEGORICAL SATISFACTION FIELDS (is_enum: true):
    When a field has sample_values like 'Highly Satisfied', 'Somewhat Satisfied', 'Somewhat dissatisfied', 'Highly dissatisfied':
  
  - NEVER convert these to numeric scales or compute numeric averages
  - ALWAYS return percentage distributions showing what percent selected each option
  - Correct output format:
      Highly Satisfied: 25%
      Somewhat Satisfied: 45%
      Somewhat dissatisfied: 20%
      Highly dissatisfied: 10%
  
  - Correct SQL pattern:
      SELECT 
        field_name,
        COUNT(*) AS responses,
        ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER(), 2) AS percentage
      FROM table
      WHERE field_name IS NOT NULL
      GROUP BY field_name
      ORDER BY percentage DESC
  
  - WRONG: Converting 'Highly Satisfied' to 10, 'Somewhat Satisfied' to 7.5, etc.

  NUMERIC RATING COLUMNS THAT EXIST IN THE VIEW:
  Only these numeric rating columns exist. All other grid/quality columns exist ONLY as _DESC (text) versions.
  
  OVERALL RATINGS (0-10 scale, 10=best):
  OVERALL_NUMRAT, CONCESS_NUMRAT, PARKING_NUMRAT, ENTERTAIN_NUMRAT (2024+),
  GE_NUMRAT (2026+), MERCH_NUMRAT (2025+, stored 0-100 divide by 10).
  Filter WHERE column < 80.
  
  STAFF RATINGS BY TYPE (0-10 scale, 2026+): TB_ADDON_23_* (see routing above).
  STAFF RATINGS BY TYPE (1-5 scale, pre-2026): TB_ADDON_4_* (see routing above).
  
  LEAGUE-STANDARD GRID RATINGS (these exist as numeric in the view):
  STAFF_GRID_SECURITY_SCANNER (pre-2025), STAFF_GRID_TICKET_SCANNER (2025+),
  CONCESS_GRID_SPEED (2026+). Scale 1-4, 1=best. Filter WHERE column < 80.
  
  ALL OTHER GRID COLUMNS (staff, concession, entertainment, brand health) exist ONLY as
  _DESC text fields (e.g., STAFF_GRID_PARKING_DESC, CONCESS_GRID_CLEAN_DESC, 
  ENTERTAIN_GRID_MUSIC_DESC, BRANDHEALTH_GRID_EXCITING_DESC). 
  Use percentage distribution analysis on these _DESC fields, NOT numeric averages.
  
  IMPORTANT: For year-over-year comparisons, GROUP BY SEASON and compute AVG() with WHERE column < 80.
  For "biggest jump in satisfaction", compare AVG across seasons for each item and rank the change.
  For _DESC fields, compare percentage distributions across seasons.
  
  SPONSOR RECALL QUERIES:
  When users ask about sponsors, sponsor recall, brand awareness, or which sponsors/brands fans remember:
  Use the TB_ADDON_10_1 through TB_ADDON_10_5 columns with a CASE expression to filter numeric codes:
  CASE WHEN REGEXP_LIKE(TB_ADDON_10_1::VARCHAR, '^[0-9]+$') THEN NULL ELSE TB_ADDON_10_1 END
  These are defined in the YAML as SPONSOR_RECALL_1 through SPONSOR_RECALL_5 (virtual columns with the filter built in).
  
  CORRECT SQL PATTERN for "top sponsors recalled":
  WITH sponsor_mentions AS (
    SELECT SPONSOR_RECALL_1 AS sponsor FROM table WHERE SPONSOR_RECALL_1 IS NOT NULL
    UNION ALL
    SELECT SPONSOR_RECALL_2 AS sponsor FROM table WHERE SPONSOR_RECALL_2 IS NOT NULL
    UNION ALL
    SELECT SPONSOR_RECALL_3 AS sponsor FROM table WHERE SPONSOR_RECALL_3 IS NOT NULL
    UNION ALL
    SELECT SPONSOR_RECALL_4 AS sponsor FROM table WHERE SPONSOR_RECALL_4 IS NOT NULL
    UNION ALL
    SELECT SPONSOR_RECALL_5 AS sponsor FROM table WHERE SPONSOR_RECALL_5 IS NOT NULL
  )
  SELECT sponsor, COUNT(*) AS recall_count
  FROM sponsor_mentions
  GROUP BY sponsor
  ORDER BY recall_count DESC;

tables:
  - name: voc_survey_responses
    description: "Post-game survey responses - For feedback and suggestions, always use text description fields ending in _DESC or _OT, not numeric code fields"
    base_table:
      database: TBRDP_DW_DEV
      schema: IM_RPT
      table: V_SBL_QUALTRICS_VOC_POST_ATTENDANCE_FULL_CORTEX_AI
    
    dimensions:
      - name: ATTENDANCE_SCREENER_DESC
        description: "Survey question: \"We know this game was rescheduled. Were you able to attend?\" Values: Yes / No. Added in 2024 season only for rescheduled games."
        expr: ATTENDANCE_SCREENER_DESC
        data_type: varchar
        synonyms: ['attendance screener', 'attendance screener description', 'attendance screener desc', 'attendance screener text']
      
      - name: ATTEND_NUM_PLAN_DESC
        description: "Survey question: \"How many Rays games do you plan to attend this season?\" Values: Between 2 and 3 games / Between 4 and 5 games / Between 6 and 10 games / Between 11 and 15 games / Between 11 and 15 games / Over 20 games."
        expr: ATTEND_NUM_PLAN_DESC
        data_type: varchar
        synonyms: ['attend num plan text', 'attend num plan description', 'attend num plan desc', 'attend num plan']
      
      - name: BRANDHEALTH_GRID_ACCESSIBLE_DESC
        description: "Survey question: \"To what extent do you agree or disagree with the following statements about the Rays?\" Sub-item: Accessible to fans of all backgrounds. Scale: 1=Strongly agree, 2=Somewhat agree, 3=Somewhat disagree, 4=Strongly disagree (lower is better)."
        expr: BRANDHEALTH_GRID_ACCESSIBLE_DESC
        data_type: varchar
        synonyms: ['brandhealth grid accessible', 'brandhealth grid accessible desc', 'brandhealth grid accessible text', 'brandhealth grid accessible description']
      
      - name: BRANDHEALTH_GRID_CHAMPION_DESC
        description: "Survey question: \"To what extent do you agree or disagree with the following statements about the Rays?\" Sub-item: A champion of the Tampa Bay community. Scale: 1=Strongly agree, 2=Somewhat agree, 3=Somewhat disagree, 4=Strongly disagree (lower is better)."
        expr: BRANDHEALTH_GRID_CHAMPION_DESC
        data_type: varchar
        synonyms: ['brandhealth grid champion', 'brandhealth grid champion description', 'brandhealth grid champion text', 'brandhealth grid champion desc']
      
      - name: BRANDHEALTH_GRID_DIVERSITY_DESC
        description: "Survey question: \"To what extent do you agree or disagree with the following statements about the Rays?\" Sub-item: Committed to diversity, equity, and inclusion. Scale: 1=Strongly agree, 2=Somewhat agree, 3=Somewhat disagree, 4=Strongly disagree (lower is better)."
        expr: BRANDHEALTH_GRID_DIVERSITY_DESC
        data_type: varchar
        synonyms: ['brandhealth grid diversity text', 'brandhealth grid diversity description', 'brandhealth grid diversity desc', 'brandhealth grid diversity']
      
      - name: BRANDHEALTH_GRID_EMOTIONAL_DESC
        description: "Survey question: \"To what extent do you agree or disagree with the following statements about the Rays?\" Sub-item: A team I feel emotionally connected to. Scale: 1=Strongly agree, 2=Somewhat agree, 3=Somewhat disagree, 4=Strongly disagree (lower is better)."
        expr: BRANDHEALTH_GRID_EMOTIONAL_DESC
        data_type: varchar
        synonyms: ['brandhealth grid emotional', 'brandhealth grid emotional desc', 'brandhealth grid emotional text', 'brandhealth grid emotional description']
      
      - name: BRANDHEALTH_GRID_EXCITING_DESC
        description: "Survey question: \"To what extent do you agree or disagree with the following statements about the Rays?\" Sub-item: An exciting team to watch. Scale: 1=Strongly agree, 2=Somewhat agree, 3=Somewhat disagree, 4=Strongly disagree (lower is better)."
        expr: BRANDHEALTH_GRID_EXCITING_DESC
        data_type: varchar
        synonyms: ['brandhealth grid exciting text', 'brandhealth grid exciting desc', 'brandhealth grid exciting description', 'brandhealth grid exciting']
        sample_values: ["Strongly agree", "Somewhat agree", "Somewhat disagree", "Strongly disagree"]
        is_enum: true
      
      - name: BRANDHEALTH_GRID_FAMFRIENDLY_DESC
        description: "To what extent do you agree or disagree with the following statements about the Rays? - Rays games are family-friendly"
        expr: BRANDHEALTH_GRID_FAMFRIENDLY_DESC
        data_type: varchar
        synonyms: ['brandhealth grid famfriendly', 'brandhealth grid famfriendly text', 'brandhealth grid famfriendly desc', 'brandhealth grid famfriendly description']
        sample_values: ["Strongly agree", "Somewhat agree", "Somewhat disagree", "Strongly disagree"]
        is_enum: true 

      - name: BRANDHEALTH_GRID_POSINFLUENCE_DESC
        description: "Survey question: \"To what extent do you agree or disagree with the following statements about the Rays?\" Sub-item: A positive influence on the community. Scale: 1=Strongly agree, 2=Somewhat agree, 3=Somewhat disagree, 4=Strongly disagree (lower is better)."
        expr: BRANDHEALTH_GRID_POSINFLUENCE_DESC
        data_type: varchar
        synonyms: ['brandhealth grid posinfluence description', 'brandhealth grid posinfluence desc', 'brandhealth grid posinfluence', 'brandhealth grid posinfluence text']
      
      - name: BRANDHEALTH_GRID_RIGHTDIRECTION_DESC
        description: "Survey question: \"To what extent do you agree or disagree with the following statements about the Rays?\" Sub-item: Headed in the right direction. Scale: 1=Strongly agree, 2=Somewhat agree, 3=Somewhat disagree, 4=Strongly disagree (lower is better)."
        expr: BRANDHEALTH_GRID_RIGHTDIRECTION_DESC
        data_type: varchar
        synonyms: ['brandhealth grid rightdirection', 'brandhealth grid rightdirection desc', 'brandhealth grid rightdirection text', 'brandhealth grid rightdirection description']
      
      - name: BRANDHEALTH_GRID_SAFE_DESC
        description: "Survey question: \"To what extent do you agree or disagree with the following statements about the Rays?\" Sub-item: Safe and secure. Scale: 1=Strongly agree, 2=Somewhat agree, 3=Somewhat disagree, 4=Strongly disagree (lower is better)."
        expr: BRANDHEALTH_GRID_SAFE_DESC
        data_type: varchar
        synonyms: ['brandhealth grid safe text', 'brandhealth grid safe', 'brandhealth grid safe desc', 'brandhealth grid safe description']
      
      - name: BRANDHEALTH_GRID_SUSTAINABILITY_DESC
        description: "Survey question: \"To what extent do you agree or disagree with the following statements about the Rays?\" Sub-item: Committed to sustainability. Scale: 1=Strongly agree, 2=Somewhat agree, 3=Somewhat disagree, 4=Strongly disagree (lower is better)."
        expr: BRANDHEALTH_GRID_SUSTAINABILITY_DESC
        data_type: varchar
        synonyms: ['brandhealth grid sustainability', 'brandhealth grid sustainability desc', 'brandhealth grid sustainability description', 'brandhealth grid sustainability text']
      
      - name: BRANDHEALTH_GRID_TRENDY_DESC
        description: "Survey question: \"To what extent do you agree or disagree with the following statements about the Rays?\" Sub-item: Trendy / hip. Scale: 1=Strongly agree, 2=Somewhat agree, 3=Somewhat disagree, 4=Strongly disagree (lower is better)."
        expr: BRANDHEALTH_GRID_TRENDY_DESC
        data_type: varchar
        synonyms: ['brandhealth grid trendy text', 'brandhealth grid trendy', 'brandhealth grid trendy description', 'brandhealth grid trendy desc']
      
      - name: BRANDHEALTH_GRID_WELCOME_DESC
        description: "Survey question: \"To what extent do you agree or disagree with the following statements about the Rays?\" Sub-item: A welcoming and family-friendly environment. Scale: 1=Strongly agree, 2=Somewhat agree, 3=Somewhat disagree, 4=Strongly disagree (lower is better)."
        expr: BRANDHEALTH_GRID_WELCOME_DESC
        data_type: varchar
        synonyms: ['brandhealth grid welcome', 'brandhealth grid welcome desc', 'brandhealth grid welcome text', 'brandhealth grid welcome description']
        sample_values: ["Strongly agree", "Somewhat agree", "Somewhat disagree", "Strongly disagree"]
        is_enum: true 

      - name: CIH_ID_DESC
        description: "Survey question: \"How many children (aged 17 or younger) live in your household?\" Response codes: 0 = None, 1 = 1, 2 = 2, 3 = 3, 4 = 4 or more, 5 = I prefer not to say. Display values: None / 1 / 2 / 3 / 4 
            or more / I prefer not to say."
        expr: CIH_ID_DESC
        data_type: varchar
        synonyms: ['cih id', 'cih id text', 'cih id desc', 'cih id description', 'children in household']
      
      - name: CLUB_PARKING_LOT_DESC
        description: "Yes or No, Indicates whether the fan parked in a stadium-affiliated parking lot (Yes/No/Not sure). For specific parking lot names in 2025 at GMS field, use parking_lot_name."
        expr: CLUB_PARKING_LOT_DESC
        data_type: varchar
        synonyms: ['did you park in a stadium affiliated parking lot', 'parked at the stadium in 202', 'club parking lot yes or no']

      - name: RESPONSE_SOURCE
        description: "Survey delivery channel. Values: 'App' (Ballpark App push notification) or 'Email'. Used to compare response patterns across delivery methods."
        expr: RESPONSE_SOURCE
        data_type: varchar
        sample_values:
          - App
          - Email
        is_enum: true
        synonyms: ["response source", "survey channel", "survey delivery", "delivery method"]
      
      - name: TB_ADDON_8_1
        description: "QUALITATIVE FEEDBACK - TICKETS/SEATS: Open text feedback where fans describe issues with their tickets or seats in their own words. Use when users ask about 'qualitative feedback on tickets'. This is NOT a rating - it contains actual written fan responses."
        expr: TB_ADDON_8_1
        data_type: varchar
        synonyms: ["tb addon 8 1","qualitative feedback tickets seats"]

      - name: TB_ADDON_8_2
        description: "QUALITATIVE FEEDBACK - STAFF/SERVICE: Open text feedback where fans describe issues with staff and service in their own words. Use when users ask about 'qualitative feedback on staff', 'qualitative feedback on service'. This is NOT a rating - it contains actual written fan responses."
        expr: TB_ADDON_8_2
        data_type: varchar
        synonyms: ["tb addon 8_2", "Qualitative Feedback - Staff/Service"]

      - name: TB_ADDON_8_3
        description: "QUALITATIVE FEEDBACK - ENTERTAINMENT: Open text feedback where fans describe issues with entertainment in their own words. Use when users ask about 'qualitative feedback on entertainment'. This is NOT a rating - it contains actual written fan responses."
        expr: TB_ADDON_8_3
        data_type: varchar
        synonyms: ["tb addon 8_3", "Quantiative feedback - entertainment"]
      
      - name: TB_ADDON_8_4
        description: "QUALITATIVE FEEDBACK - CONCESSIONS/FOOD/BEVERAGE: Open text feedback where fans describe issues with food and beverages in their own words. Use when users ask about 'qualitative feedback on food'. This is NOT a rating - it contains actual written fan responses."
        expr: TB_ADDON_8_4
        data_type: varchar
        synonyms: ["tb addon 8_4","Qualitative Feedback - Concessions/Food/Beverage"]
      
      - name: TB_ADDON_8_5
        description: "QUALITATIVE FEEDBACK - CLEANLINESS: Open text feedback where fans describe issues with cleanliness in their own words. Use when users ask about 'qualitative feedback on cleanliness'.This is NOT a rating - it contains actual written fan responses."
        expr: TB_ADDON_8_5
        data_type: varchar
        synonyms: ["tb addon TB_ADDON_8_5","Qualitative Feedback - Cleanliness"]
      
      - name: TB_ADDON_8_6
        description: "QUALITATIVE FEEDBACK - PARKING: Open text feedback where fans describe issues with parking in their own words. Use when users ask about 'qualitative feedback on parking; This is NOT a rating - it contains actual written fan responses." 
        expr: TB_ADDON_8_6
        data_type: varchar
        synonyms: ["tb addon 8_6", "Qualitative Feedback - Parking"]
      
      - name: TB_ADDON_8_7
        description: "QUALITATIVE FEEDBACK - RETAIL/MERCHANDISE: Open text feedback where fans describe issues with retail and merchandise in their own words. Use when users ask about 'qualitative feedback on merchandise', 'qualitative feedback on team store'. This is NOT a rating - it contains actual written fan responses."
        expr: TB_ADDON_8_7
        data_type: varchar
        synonyms: ["tb addon 8_7", "Qualitative Feedback - Retail/Merchandise"]
      
      - name: TB_ADDON_8_8
        description: "QUALITATIVE FEEDBACK - SAFETY/SECURITY: Open text feedback where fans describe issues with safety and security in their own words. Use when users ask about 'qualitative feedback on security', 'qualitative feedback on safety'. This is NOT a rating - it contains actual written fan responses."
        expr: TB_ADDON_8_8
        data_type: varchar
        synonyms: ["tb addon 8_8", "Qualitative Feedback - Safety/Security"]
      
      - name: TB_ADDON_8_9
        description: "QUALITATIVE FEEDBACK - APP: Open text feedback where fans describe issues with the mobile app in their own words. Use when users ask about 'qualitative feedback on app', 'qualitative feedback on mobile', This is NOT a rating - it contains actual written fan responses."
