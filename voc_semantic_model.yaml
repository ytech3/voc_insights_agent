      table: V_MERCH_NO_ANALYSIS_SIMPLE
    
    dimensions:
      - name: season
        description: "Baseball season year"
        expr: season
        data_type: number
        synonyms: ['year', 'season year']
      
      - name: game_date
        description: "Date of the game"
        expr: game_date
        data_type: date
      
      - name: buyer_type
        description: "Type of ticket buyer"
        expr: buyer_type
        data_type: varchar
      
      - name: reason_category
        description: "AI-classified reason for not purchasing merchandise. Categories include: Budget/Cost, No Time, Product Selection, Sizing Issues, Not Interested, Already Own Items, Forgot"
        expr: reason_category
        data_type: varchar
        synonyms: 
          - 'merch reason'
          - 'non-purchase reason'
          - 'why no merch'
          - 'merchandise issue'
      
      - name: sentiment_category
        description: "Sentiment of the feedback (Positive, Neutral, Negative)"
        expr: sentiment_category
        data_type: varchar
        synonyms: ['sentiment', 'tone']
      
      - name: feedback_text
        description: "Original feedback text explaining why they didn't purchase merchandise"
        expr: feedback_text
        data_type: varchar
        synonyms: 
          - 'comment'
          - 'reason text'
          - 'explanation'
    
    metrics:
