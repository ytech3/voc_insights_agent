name: Deploy Static Web App - rays-voc-agent

on:
  push:
    branches:
      - patch19
    paths:
      - 'Dashboard/azure_deploy/webapp/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Static Web App — manual deploy required
        run: |
          echo "rays-voc-agent uses provider type SwaCli."
          echo "GitHub Actions token auth does not work with this provider type."
          echo ""
          echo "To deploy frontend changes, use the SWA CLI locally:"
          echo "  npx @azure/static-web-apps-cli deploy Dashboard/azure_deploy/webapp --deployment-token <token> --env production"
          echo ""
          echo "Deployment token is stored in 1Password."
          echo "See Dashboard/DEPLOY.md for full instructions."
